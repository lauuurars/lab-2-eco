<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lab 2 Eco</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-200 via-violet-300 to-fuchsia-300 flex items-center justify-center">

    <div id="form-content" class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md">
        
        <h1 class="text-3xl font-bold text-center text-violet-500 mb-6">
            Create Post ₍^. .^₎⟆
        </h1>

        <form class="space-y-5">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    URL Img
                </label>
                <input 
                    type="text" 
                    placeholder="Type a Image URL"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-400 focus:border-transparent transition"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Title
                </label>
                <input 
                    type="text" 
                    placeholder="Type a title"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-400 focus:border-transparent transition"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Description
                </label>
                <textarea 
                    rows="4"
                    placeholder="Type a description"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-400 focus:border-transparent transition resize-none"
                ></textarea>
            </div>

            <button 
                type="submit"
                class="w-full bg-violet-400 text-white py-2 rounded-lg font-semibold hover:bg-violet-500 active:scale-95 transition all"
            >
                Create POST
            </button>

                        <button 
                type="submit"
                class="w-full bg-[#9D4EDD] text-white py-2 rounded-lg font-semibold hover:bg-[#B983FF] active:scale-95 transition all"
            >
                List POSTS
            </button>

        </form>
    </div>

</body>
</html>
